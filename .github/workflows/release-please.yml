name: Release Please

on:
  push:
    branches: [prod]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      api_release_created: ${{ steps.release-please.outputs['infra-maps-api--release_created'] }}
      api_tag: ${{ steps.release-please.outputs['infra-maps-api--tag_name'] }}
    steps:
      - name: Ensure release-please labels exist
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          for label in "autorelease: pending" "autorelease: tagged" "autorelease: failed" "autorelease: snapshot"; do
            gh label create "$label" --repo "${{ github.repository }}" --color "ededed" 2>/dev/null || true
          done

      - uses: googleapis/release-please-action@v4
        id: release-please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Publie l'image versionnée sur GHCR quand une release backend est créée.
  # Tag image = tag de release. Jamais de :latest en prod.
  docker-publish:
    needs: release-please
    if: needs.release-please.outputs.api_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: infra-maps-api
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/infra-maps-api:${{ needs.release-please.outputs.api_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
