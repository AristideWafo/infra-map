name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release-please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please opens/updates a "chore: release X" PR (labeled
      # "autorelease: pending") that accumulates Conventional Commits since
      # the last tag. Auto-merging it is what makes releases fully automatic:
      # once backend-ci/frontend-ci are required status checks (branch
      # protection), this PR can only merge after tests pass, and merging it
      # is what triggers the tag + GitHub Release + CHANGELOG update.
      - name: Enable auto-merge on pending release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "${{ github.repository }}" \
            --search 'label:"autorelease: pending"' --state open --json number \
            -q '.[].number' | while read -r pr; do
            gh pr merge "$pr" --squash --auto --repo "${{ github.repository }}"
          done
