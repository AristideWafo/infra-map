name: Frontend CI

on:
  push:
    branches: [prod]
    paths:
      - 'infra-maps-ui/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [prod]
    paths:
      - 'infra-maps-ui/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: infra-maps-ui

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra-maps-ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check + unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
